aid: rentcheck
name: RentCheck
description: >-
  RentCheck is a resident-led property inspection platform used by 1,000+ property management
  companies to run guided move-in, move-out, routine, and maintenance inspections that residents
  complete from their smartphone, producing standardized, time-stamped photo reports. Its REST API
  (OpenAPI 3.1, 160 paths / 217 operations) lets developers pull property, unit, building, community,
  and resident data, schedule and create inspections from customizable templates, review inspection
  features and photos, flag maintenance issues, and wire results into property-management systems
  such as AppFolio, Rent Manager, Rentvine, Buildium, Latchel, and Zapier.
