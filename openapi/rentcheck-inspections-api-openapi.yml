        '400':
          description: "Bad request — request body validation failed, or one of the inspection\nstate-machine checks rejected the update. Examples:\n  - `due_date has an invalid value: must be a valid date in the future`\n  - `invite_date has an invalid value: must be a valid date in the future`\n  - `inspection status does not support invite date update`\n  - `invitation date should not be after due date`\n  - `unable to complete initial review`\n  - `unable to undo initial review`\n  - `can not update \"<field>\" on completed inspection`\n  - validation messages such as `\"archived\" must be a boolean`, `\"inspection_label\" must be a string` — the raw body is validated, so paths are not prefixed with `data.`.\n"
          content:
