  /v1/inspections/{inspectionId}/signature-requests/{requestId}/claim:
    post:
      x-internal: true
      summary: Claim a signature request from a deep link
      tags:
      - Inspections
      description: 'Claims a pending additional-signature request from a Branch deep link,

        reassigning `recipient_email` to the authenticated caller. The linked

        request and every other pending additional-signature request addressed to

        the original recipient''s email are reassigned to the caller.


        Possession of the high-entropy request id is treated as the capability to

        claim the request (the deep link acts as a bearer token), so — unlike the

        GET endpoint — this endpoint does not require the caller''s email to match

        the request''s recipient. Returns the affected requests so the apps can

        surface the newly-claimed inspections.

        '
      parameters:
      - name: inspectionId
        in: path
        description: 'Inspection ID. Pass the literal `*`; the deep link only carries the

          request id and the inspection is resolved from the request

          itself.

          '
        required: true
        schema:
          type: string
      - name: requestId
        in: path
        description: Signature request ID from the deep link.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The requests reassigned to the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/api_inspection_request'
                  count:
                    type: integer
                    description: Amount of elements in `data`.
                  total_results:
                    type: integer
                    description: Total number of requests reassigned to the caller.
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: Not Found — `inspection signature request not found`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 404
                  error:
                    type: string
