components:
  schemas:
    api_invite_model:
      type: object
      required:
      - id
      - invite_type
      - status
      - created_date
      - reference_code
      - created_by
      - recipient_email
      - inspection
      - property
      properties:
        id:
          type: string
          description: Entity ID
          example: 00BRcZPSakXz6w7RYoE
        invite_type:
          type: string
          description: The type of the invite
          enum:
          - Perform Inspection
          - Inspection Request
          - Review Inspection
        status:
          type: string
          description: The status reflects if the invite is sent or accepted
          enum:
          - sent
          - accepted
        created_date:
          type: string
          description: Entity creation date, in ISO format
          example: 2022-12-02 14:15:37.925000
        reference_code:
          type: string
          description: 4 or 6 character string to inform when accepting the invite
          example: ABC123
        created_by:
          type: object
          required:
          - id
          - name
          - email
          - type
          - display_name
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            name:
              type: string
              description: Name of the user
            email:
              type: string
              description: Email of the user
            type:
              type: string
              enum:
              - Renter
              - Property Manager
              - Landlord
              - System
              description: User type discriminator.
            display_name:
              type: string
              description: Either the name of the organization or the creator name
            organization_id:
              type: string
              description: Id of the Team who created or administers the Entity.
              example: 05fDGZRKp4nVmlmEwjsv
        accepted_by:
          type: object
          required:
          - id
          - name
          - email
          - type
          description: Data of who accepted the invite. This can differ from recipient_email because a different user can accept an invite given a correct reference_code
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            name:
              type: string
              description: Name of the user
            email:
              type: string
              description: Email of the user
            type:
              type: string
              enum:
              - Renter
              - Property Manager
              - Landlord
              - System
              description: User type discriminator.
        recipient_email:
          type: string
          description: Email that the invite was originally sent to
        inspection:
          type: object
          required:
          - id
          - label
          - due_date
          - inspection_template
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            label:
              type: string
              description: Inspection label.
            due_date:
              type: string
              description: The inspection due date (legacy) is the original date by which the recipient must complete the inspection.
              example: 2021-12-02 14:15:37.925000
            inspection_template:
              type: object
              required:
              - id
              - name
              - internal_label
              - property_type
              - display_name
              properties:
                id:
                  type: string
                  description: Inspection template identifier
                name:
                  type: string
                  description: Inspection template name.
                internal_label:
                  type: string
                  description: Inspection template internal label.
                property_type:
                  type: string
                  description: Inspection template property type.
                display_name:
                  type: string
                  description: Resolved display name for the inspection template, used by clients to render the template title (mirrors `name` for legacy templates).
        property:
          type: object
          required:
          - id
          - address
          - city
          - zip_code
          description: This is the entity id of the Unit, Building, or Community that the entity is for.
          properties:
            id:
              type: string
              description: Selected entity's property id
              example: 00BRcZPSakXz6w7RYoE
            address:
              type: string
              description: Selected entity's property address
              example: 2001 Red Gates
            address_2:
              type: string
              description: Selected entity's property additional address info
              example: Apt. 4B
            city:
              type: string
              description: Selected entity's property city
              example: New Orleans
            region:
              type: string
              description: Selected entity's property region
              example: Orleans
            zip_code:
              type: string
              description: Selected entity's property zip_code
              example: '70130'
    api_inspection_digest:
      type: object
      required:
      - id
      - property
      - inspection_template
      - inspection_status
      - effective_due_date
      - completed_date
      - archived
      - progress_pct
      - features_ratings
      - permissions
      - assigned_recipients
      - metadata
      properties:
        id:
          type: string
          description: Entity ID
          example: 00BRcZPSakXz6w7RYoE
        property:
          type: object
          required:
          - id
          - address
          - city
          - zip_code
          - type
          description: Property snapshot embedded in the inspection digest. Carries the `type` discriminator (and optionally `x_id`) — distinct from the leaner basic-property shape used elsewhere.
          properties:
            id:
              type: string
              description: Property id
              example: 00BRcZPSakXz6w7RYoE
            x_id:
              type: string
              description: External property ID from a synced integration, when set.
            address:
              type: string
              description: Property street address
              example: 2001 Red Gates
            address_2:
              type: string
              description: Property additional address info
              example: Apt. 4B
            city:
              type: string
              description: Property city
              example: New Orleans
            region:
              type: string
              description: Property region
              example: Orleans
            zip_code:
              type: string
              description: Property zip code
              example: '70130'
            type:
              type: string
              description: Property's type discriminator.
              enum:
              - Single-Family
              - Multi-Family
              - Apartment or Condo
              - Commercial
              - Building
              - Community
              - ''
        inspection_template:
          type: object
          required:
          - id
          - name
          - internal_label
          - property_type
          - display_name
          properties:
            id:
              type: string
              description: Inspection template identifier
            name:
              type: string
              description: Inspection template name.
            internal_label:
              type: string
              description: Inspection template internal label.
            property_type:
              type: string
              description: Inspection template property type.
            display_name:
              type: string
              description: Resolved display name for the inspection template, used by clients to render the template title (mirrors `name` for legacy templates).
        inspection_status:
          type: string
          description: Inspection status represents the actual status of the current inspection.
          enum:
          - Scheduled
          - Not Started
          - Started
          - In Review
          - Completed
          - Awaiting Review
          - Revision Requested
          - Revision Review
          - Approved
        inspection_label:
          type: string
        effective_due_date:
          type: string
          description: The inspection’s effective due date is whichever due date applies — original, revision, or review — whether it’s already passed or still upcoming.
          example: 2021-12-02 14:15:37.925000
        completed_date:
          type: string
          description: Completed Date is the date that the user submitted the inspection for approval or completed the inspection if it was self-performed.
          example: 2021-12-02 14:15:37.925000
        fast_track:
          type: boolean
