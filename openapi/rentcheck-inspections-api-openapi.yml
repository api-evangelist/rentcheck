          pattern: ^\d{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])$
        description: 'Value to filter inspection effective due date by a starting date.

          Must be in `yyyy-mm-dd` format.

          '
      - in: query
        name: filters[due_date][end_date]
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])$
        description: 'Value to filter inspection effective due date by an ending date.

          Must be in `yyyy-mm-dd` format. `end_date`

          must be on or after `start_date`, otherwise the response returns

          `end date must be equal or after start date`.

          '
      - in: query
        name: filters[due_date_legacy][start_date]
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])$
        description: 'Value to filter inspection due date (pre-effective-due-date) by a starting date.

          Must be in `yyyy-mm-dd` format. Cannot be combined with

          `filters[due_date]`; that combination is rejected with

          `You cannot use both due_date and due_date_legacy filters at the same time`.

          '
      - in: query
        name: filters[due_date_legacy][end_date]
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])$
        description: 'Value to filter inspection due date (pre-effective-due-date) by an ending date.

          Must be in `yyyy-mm-dd` format. `end_date`

          must be on or after `start_date`, otherwise the response returns

          `end date must be equal or after start date`. See `start_date` for the

          mutually-exclusive constraint with `filters[due_date]`.

          '
      - in: query
        name: filters[completed_date][start_date]
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])$
        description: 'Value to filter completed inspection date by a starting date.

          Must be in `yyyy-mm-dd` format.

          '
      - in: query
        name: filters[completed_date][end_date]
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])$
        description: 'Value to filter completed inspection date by an ending date.

          Must be in `yyyy-mm-dd` format. `end_date`

          must be on or after `start_date`, otherwise the response returns

          `end date must be equal or after start date`.

          '
      responses:
        '200':
          description: Returns the paginated list of inspection digests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/api_inspection_digest'
                  count:
                    type: integer
                    description: Amount of elements in `data`.
                  total_results:
                    type: integer
                    description: Amount of total elements according to search criteria.
        '400':
          description: "Bad request — query-string filters failed validation. Examples:\n  - `You cannot use both due_date and due_date_legacy filters at the same time`\n  - `end date must be equal or after start date`\n  - date-pattern messages when the supplied date is not ISO.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 400
                  error:
                    type: string
                    example: end date must be equal or after start date
        '401':
          $ref: '#/components/responses/401'
