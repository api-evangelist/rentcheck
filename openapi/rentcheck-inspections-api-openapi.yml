    api_integration_sync:
      x-internal: true
      type: object
      nullable: true
      description: Canonical API shape for an inspection's integration sync state. Every vendor is mapped into this envelope — engine-native AppFolio / Buildium pass through, and legacy Rent Manager / Rentvine per-vendor sync objects are mapped up — so the client reads one uniform structure regardless of source vendor. Returns `null` on the inspection response when the inspection has no active integration sync.
      required:
      - vendor
      - vendor_integration_id
      - last_sync
      - status
      properties:
        vendor:
          type: string
          enum:
          - appfolio
          - rentvine
          - rentmanager
          - buildium
        vendor_integration_id:
          type: string
        last_sync:
          type: string
          nullable: true
          description: ISO string of the most recent successful sync; `null` when the record has never synced successfully.
        status:
          type: string
          description: '`scheduled` / `processing` mark in-flight manual re-syncs.'
          enum:
          - scheduled
          - processing
          - success
          - error
        error:
          type: object
          nullable: true
          required:
          - message
          description: 'Failure detail. Populated for `status: ''error''` even when the engine envelope only carried the failure per-resource on `upload_response` — the builder aggregates the per-resource messages up so the client always has a message to show.'
          properties:
            message:
              type: string
            vendor_request_id:
              type: string
        upload_response:
          type: object
          description: Per-destination upload outcome, keyed by resource. Any of the keys may be absent when the corresponding resource has not been attempted.
          properties:
            units:
              $ref: '#/components/schemas/api_inspection_upload_response_entry'
            properties:
              $ref: '#/components/schemas/api_inspection_upload_response_entry'
            occupancies:
              $ref: '#/components/schemas/api_inspection_upload_response_entry'
            work_orders:
              $ref: '#/components/schemas/api_inspection_upload_response_entry'
            inspections:
              $ref: '#/components/schemas/api_inspection_upload_response_entry'
        pending_since:
          type: string
          nullable: true
          description: ISO string set while `status` is `scheduled` / `processing`; used by the API to expire stale pending state past a TTL.
