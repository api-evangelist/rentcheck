    inspection_update_request_model:
      type: object
      description: All fields are optional; only the fields supplied are applied. Some fields are only writable in specific inspection statuses (e.g. `due_date`/`invite_date`/`recipients` are only honored before completion).
      properties:
        archived:
          type: boolean
          description: Whether or not this inspection should be archived.
        inspection_label:
          type: string
          description: Inspection label to be displayed.
        x_id:
          type: string
          description: External inspection ID that maps to RentCheck inspections
        due_date:
          type: string
          description: The inspection due date (legacy) is the original date by which the recipient must complete the inspection.
          example: 2021-12-02 14:15:37.925000
        invite_date:
          type: string
          format: date-time
          description: Invite date for the inspection. Only honored while the inspection is in `Scheduled` status.
        recipients:
          type: object
          description: Reassigns who can access the inspection. Only honored before the inspection is completed. `type` is optional on update; when omitted the existing assignment is left unchanged.
          properties:
            type:
              type: string
              enum:
              - self-perform
              - emails
              - teammates
              - myself
              - residents
            emails:
              type: array
              description: Only mandatory if type is emails
              items:
                type: string
                description: Recipients' email
              example:
              - email1@domain.com
              - email2@domain.com
            teammate_emails:
              type: object
              description: Only mandatory if type is `teammates`. Keys are the target property ids; values are the arrays of teammate emails to assign for that property. Any property-id key is accepted, and each value must contain at least one email address.
              additionalProperties:
                type: array
                description: Teammate emails assigned to this property id.
                minItems: 1
                items:
                  type: string
                  format: email
              example:
                property123:
                - email1@domain.com
                - email2@domain.com
                property456:
                - email3@domain.com
            resident_type:
              type: string
              enum:
              - current
              - future
              default: current
        notify_residents:
          type: object
          description: Optional resident-notification payload. Only used when the update sets `recipients.type` to `teammates` — the current residents are then emailed to let them know a teammate has been assigned to inspect their unit. Ignored for other recipient types.
          properties:
            note:
              type: string
              description: Free-form note added to the resident notification email.
        status:
          type: string
          description: 'Manual status transition. The accepted values depend on the inspection role: `Continue Inspection` undoes a submission, `Inspection Complete` finalizes the inspection, and `Review Inspection` triggers an initial review.'
          enum:
          - Continue Inspection
          - Inspection Complete
          - Review Inspection
        room_names:
          type: array
          description: Replacement list of room names. Only honored while the inspection has not been submitted.
          items:
            type: string
        is_initial_review_complete:
          type: boolean
          description: Mark/unmark the initial review as complete. Reviewers only — invalid transitions return `unable to complete initial review` / `unable to undo initial review`.
    inspection_review_request_model:
      type: object
      required:
      - recipients
      - due_date
      properties:
        recipients:
          type: array
          minItems: 1
          description: Recipients' emails. Each entry is validated as a lowercase email address before being saved. When used for review requests, an empty array is rejected with `"data.recipients" must contain at least 1 items`.
          items:
            type: string
            format: email
        due_date:
          type: string
          description: The inspection due date (legacy) is the original date by which the recipient must complete the inspection.
          example: 2021-12-02 14:15:37.925000
        message:
          type: string
          description: Message to be displayed to the recipient
          example: Missing photos of the kitchen
  responses:
    inspection_access_unauthorized:
      description: Unauthorized — standard auth-token failures, plus the inspection access check. When the caller cannot access the target inspection, this surfaces as 401 with the message `User does not have permissions to access inspection`.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                description: HTTP status code
                example: 401
              error:
                type: string
                enum:
                - token is not valid
                - authorization header is empty
                - authorization header is not valid
                - 'format for Authorization must be: Bearer [token]'
                - refresh token is not valid for resources
                - not well-formed token
                - User does not have permissions to access inspection
                example: User does not have permissions to access inspection
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                description: HTTP status code
                example: 404
              error:
                type: string
                description: Error message describing the missing resource
                example: property not found
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                description: HTTP status code
                example: 401
              error:
                type: string
                description: Error message
                enum:
                - token is not valid
                - authorization header is empty
                - authorization header is not valid
                - 'format for Authorization must be: Bearer [token]'
                - refresh token is not valid for resources
                - not well-formed token
                example: token is not valid
  securitySchemes:
    bearerAuth:
      description: Authorization key needed to use the API
      type: http
      scheme: bearer
      bearerFormat: JWT
    x-app-id:
      description: Represents the identification of you application
      type: apiKey
      name: x-app-id
      in: header
      required: true
    x-app-secret:
      description: Represents the secret for your application
      type: apiKey
      name: x-app-secret
      in: header
      required: true
