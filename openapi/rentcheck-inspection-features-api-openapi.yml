        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: 'Not Found — `inspection feature not found` when the `featureId` does

            not resolve. `inspection not found` can also be returned when the

            parent inspection is missing.

            '
          content:
            application/json:
              schema:
                type: object
