  /v2/inspections/{inspectionId}/features/submit:
    post:
      x-internal: true
      summary: Submit an inspection feature
      tags:
      - Inspection Features
      description: 'Idempotent submit of an inspection feature. Used by the mobile app to commit a feature''s rating, notes, media, and (optionally) review/revision payload. When `id` is omitted on first submit, the API treats this as a create; subsequent submits with the same `id` update the existing feature.

        '
      parameters:
      - name: inspectionId
        in: path
        required: true
        description: Inspection ID
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inspection_feature_submit_request_model'
      responses:
        '200':
          description: Returns the submitted feature.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  data:
                    $ref: '#/components/schemas/api_inspection_feature'
        '400':
          description: "Bad request — request body validation failed, or the\nfeature payload references a section / feature-name that does not\nmatch the inspection's template. The latter class of errors carry the\nfollowing message shapes:\n  - `feature name \"<name>\" for feature id \"<id>\" does not match existing feature`\n  - `section name \"<section>\" for feature id \"<id>\" does not match existing feature`\n  - `section name with ordinal \"<name_with_ordinal>\" for feature id \"<id>\" does not match existing feature`\n  - `section name \"<name>\" is not a valid section name`\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: feature name "Front Door" for feature id "abc123" does not match existing feature
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: "Forbidden — emitted in two cases:\n  - The caller does not have permission to submit features on this\n    inspection.\n  - The inspection is not in a status that allows feature submits\n    (valid statuses are `Not Started`, `Started`, `In Review`,\n    `Revision Requested`). The error string surfaces the inspection's\n    current status and the valid list.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 403
                  error:
                    type: string
                    example: 'inspection is not in a valid status to submit inspection features. Current status: Completed. Valid statuses: Not Started, Started, In Review, Revision Requested.'
        '404':
          description: 'Not Found — `inspection not found`, `inspection template not found`,

            `section not found`, or `user not found` when a

            referenced resource cannot be resolved.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 404
                  error:
                    type: string
                    example: inspection not found
