    notifications_preferences_response_model:
      type: object
      required:
      - id
      - inspections_awaiting_review
      - inspections_in_revision_review
      - inspections_completed
      - automation_failures
      properties:
        id:
          type: string
          description: Entity ID
          example: 00BRcZPSakXz6w7RYoE
        user_id:
          type: string
          description: Set when the preferences belong to a registered RentCheck user.
        user_email:
          type: string
          description: Set when the preferences belong to an unregistered recipient managing settings via an emailed token.
        subscription_id:
          type: string
          description: Set when the preferences are the subscription-level defaults applied when no per-user preferences exist.
        inspections_awaiting_review:
          $ref: '#/components/schemas/notification_preference'
        inspections_in_revision_review:
          $ref: '#/components/schemas/notification_preference'
        inspections_completed:
          $ref: '#/components/schemas/notification_preference'
        automation_failures:
          $ref: '#/components/schemas/notification_preference_no_email'
    intercom_update_companies_request_model:
      x-internal: true
      type: object
      required:
      - companyId
      description: Attaches the caller to the given Intercom company.
      properties:
        companyId:
          type: string
          description: Intercom company id the authenticated user should be attached to.
    api_user:
      type: object
      description: Full user document for the authenticated caller.
      required:
      - id
      - email
      - name
      - type
      - created_date
      - metadata
      - internal_admin
      - internal_sales
      - template_admin
      - teams
      - permissions
      properties:
        id:
          type: string
          description: Entity ID
          example: 00BRcZPSakXz6w7RYoE
        email:
          type: string
          description: The user's email.
        name:
          type: string
          description: The user's full name.
        type:
          type: string
          enum:
          - Renter
          - Property Manager
          - Landlord
          - System
          description: User type.
        created_date:
          type: string
          description: ISO timestamp the user was created.
        fcm_tokens:
          type: array
          items:
            type: string
          description: Registered FCM device tokens for push notifications.
        temporary_password:
          type: string
          description: Temporary password assigned when the account was created on behalf of the user; cleared on first password update.
        internal_admin:
          type: boolean
          description: When true, the user has access to the internal admin panel.
        internal_sales:
          type: boolean
          description: When true, the user has access to the internal sales panel.
        template_admin:
          type: boolean
          description: When true, the user can edit shared inspection templates.
        prospect_data:
          type: object
          additionalProperties: true
          description: Sales prospect payload captured during the demo follow-up flow. Only set when the user has no active subscription.
        teams:
          type: array
          items:
            $ref: '#/components/schemas/api_user_team_digest'
          description: Teams the user belongs to and their role on each.
        current_occupancy:
          type: object
          additionalProperties: true
          description: When the caller is a renter, the occupancy currently flagged `current`.
        metadata:
          $ref: '#/components/schemas/api_user_metadata'
        permissions:
          type: object
          required:
          - allow_billing_plan_editing
          - allow_automation_creation
          - allow_automation_editing
          - allow_notifications_preferences_editing
          - allow_inspection_messaging_editing
          - allow_ai_manual_scan
          properties:
            allow_billing_plan_editing:
              type: boolean
            allow_automation_creation:
              type: boolean
            allow_automation_editing:
              type: boolean
            allow_notifications_preferences_editing:
              type: boolean
            allow_inspection_messaging_editing:
              type: boolean
            allow_ai_manual_scan:
              type: boolean
          description: Per-feature permissions resolved from the user's permission groups and subscription.
        external_identities:
          $ref: '#/components/schemas/api_user_external_identities'
    user_create_request_model:
      type: object
      required:
      - email
      - first_name
      - last_name
      - password
      - user_type
      properties:
        email:
          type: string
          description: The new user's email address.
        first_name:
          type: string
          description: The new user's first name.
        last_name:
          type: string
          description: The new user's last name.
        password:
          type: string
          description: The new user's password.
        user_type:
          type: string
          enum:
          - Renter
          - Property Manager
          - Landlord
          description: User account type for the new user. Restricted to end-user types; `System` is rejected with `400 user type has an invalid value`.
        bypass_email_validation:
          type: boolean
          description: When true, skips spell-checking the email for typos. Internal use only.
        total_properties:
          type: integer
          description: Optional total properties count captured at sign-up.
        needs_to_perform_onboarding:
          type: boolean
          description: When true, the new user is flagged to see the post sign-up onboarding flow.
    user_invite_request_model:
      type: object
      required:
      - emails
      - team_ids
      - role
      - permission_group_ids
      properties:
        emails:
          type: array
          items:
            type: string
          minItems: 1
          description: Email addresses to invite.
        team_ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Teams that the invited users should be added to.
        role:
          type: string
          enum:
          - admin
          - manager
          - none
          description: Role granted to the user inside a team membership.
        permission_group_ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Permission groups that the invited users should be added to.
    me_get_firebase_token_response_model:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: Short-lived Firebase custom auth token minted for the caller.
    notification_preference_no_email:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Whether notifications for this category are enabled at all.
    api_intercom_article:
      x-internal: true
      type: object
      description: Intercom Help Center article record — a direct pass-through of the Intercom `articles` REST resource, cached by the RentCheck backend.
      required:
      - id
      - type
      - workspace_id
      - parent_type
      - title
      - description
      - body
      - author_id
      - state
      - created_at
      - updated_at
      - url
      properties:
        id:
          type: string
          description: Intercom article id.
        type:
          type: string
          description: Intercom resource type — always `"article"` for this endpoint.
        workspace_id:
          type: string
          description: Intercom workspace the article belongs to.
        parent_id:
          type: integer
          description: Optional Intercom collection/section id the article is nested under (the immediate parent).
        parent_ids:
          type: array
          items:
            type: integer
          description: Optional Intercom parent chain (collection → section → …) for the article.
        parent_type:
          type: string
          enum:
          - collection
          - section
          description: Kind of parent the article lives under.
        title:
          type: string
          description: Article title.
        description:
          type: string
          description: Short article summary.
        body:
          type: string
          description: Full HTML article body as authored in Intercom.
        author_id:
          type: integer
          description: Intercom user id of the article author.
        state:
          type: string
          enum:
          - published
          - draft
          description: Publication state. The handler filters to `published` by default.
        created_at:
          type: integer
          format: int64
          description: Unix epoch seconds when the article was created (Intercom native format).
        updated_at:
          type: integer
          format: int64
          description: Unix epoch seconds when the article was last updated (Intercom native format).
        url:
          type: string
          description: Public Help Center URL for the article.
  responses:
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                description: HTTP status code
                example: 401
              error:
                type: string
                description: Error message
                enum:
                - token is not valid
                - authorization header is empty
                - authorization header is not valid
                - 'format for Authorization must be: Bearer [token]'
                - refresh token is not valid for resources
                - not well-formed token
                example: token is not valid
  securitySchemes:
    bearerAuth:
      description: Authorization key needed to use the API
      type: http
      scheme: bearer
      bearerFormat: JWT
    x-app-id:
      description: Represents the identification of you application
      type: apiKey
      name: x-app-id
      in: header
      required: true
    x-app-secret:
      description: Represents the secret for your application
      type: apiKey
      name: x-app-secret
      in: header
      required: true
