    get:
      summary: Get all users
      tags:
      - Users
      description: Get all users
      parameters:
      - in: query
        name: filters[search]
        description: Search by user name, email or id.
        schema:
          type: string
      - in: query
        name: filters[team_ids]
        description: Filter by team ids. It accept multiple ids separated by comma.
        schema:
          type: string
      - in: query
        name: filters[permission_group_ids]
        description: Filter by permission group ids. It accept multiple ids separated by comma
        schema:
          type: string
      - in: query
        name: filters[status]
        description: Filter by user status.
        schema:
          type: string
          enum:
          - Active
          - Invited
      - in: query
        name: options[pagination][page_size]
        description: How many items to be returned for each page.
        schema:
          type: integer
          default: 20
      - in: query
        name: options[pagination][page_number]
        description: Zero-indexed page number.
        schema:
          type: integer
          default: 0
      - in: query
        name: options[sort][sort_type]
        description: Sort list in ascending or descending order.
        schema:
          type: string
          default: ASC
          enum:
          - ASC
          - DESC
      - in: query
        name: options[sort][sort_by]
