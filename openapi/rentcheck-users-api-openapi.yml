components:
  schemas:
    api_user_team_digest:
      type: object
      required:
      - id
      - name
      - internal_label
      - role
      properties:
        id:
          type: string
          description: Entity ID
          example: 00BRcZPSakXz6w7RYoE
        name:
          type: string
          description: Team display name.
        internal_label:
          type: string
          description: Internal label used to differentiate similar teams.
        role:
          type: string
          enum:
          - admin
          - manager
          - none
          description: The user's membership role within this team.
    me_link_with_tenant_request_model:
      type: object
      required:
      - invite_id
      description: Request body for linking the caller to a tenant record via an invite.
      properties:
        invite_id:
          type: string
          description: ID of the inspection invite whose tenant record should be linked to the caller.
          example: 00BRcZPSakXz6w7RYoE
    api_inspection_request:
      type: object
      required:
      - id
      - created_date
      - status
      - type
      - sent_by
      - received_by
      - inspection
      - property
      properties:
        id:
          type: string
          description: Entity ID
          example: 00BRcZPSakXz6w7RYoE
        created_date:
          type: string
          description: Request creation timestamp, in ISO format.
        status:
          type: string
          enum:
          - REQUEST_SENT
          - REQUEST_ACCEPTED
          - REQUEST_DECLINED
          - REQUEST_FULFILLED
          description: Lifecycle state of the signature request.
        type:
          type: string
          enum:
          - ADDITIONAL_SIGNATURE
          description: Type of inspection request.
        sent_by:
          type: object
          required:
          - id
          - name
          - email
          - type
          description: User that created the request.
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            name:
              type: string
              description: Name of the user
            email:
              type: string
              description: Email of the user
            type:
              type: string
              enum:
              - Renter
              - Property Manager
              - Landlord
              - System
              description: User type discriminator.
        received_by:
          type: object
          required:
          - email
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            email:
              type: string
              description: Email the request was sent to.
            name:
              type: string
              description: Recipient name, when known.
        inspection:
          type: object
          required:
          - id
          - label
          - due_date
          - inspection_template
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            label:
              type: string
              description: Inspection label.
            due_date:
              type: string
              description: The inspection due date (legacy) is the original date by which the recipient must complete the inspection.
              example: 2021-12-02 14:15:37.925000
            inspection_template:
              type: object
              required:
              - id
              - name
              - internal_label
              - property_type
              - display_name
              properties:
                id:
                  type: string
                  description: Inspection template identifier
                name:
                  type: string
                  description: Inspection template name.
                internal_label:
                  type: string
                  description: Inspection template internal label.
                property_type:
                  type: string
                  description: Inspection template property type.
                display_name:
                  type: string
                  description: Resolved display name for the inspection template, used by clients to render the template title (mirrors `name` for legacy templates).
        property:
          type: object
          required:
          - id
          - address
          - city
          - zip_code
          description: This is the entity id of the Unit, Building, or Community that the entity is for.
          properties:
            id:
              type: string
              description: Selected entity's property id
              example: 00BRcZPSakXz6w7RYoE
            address:
              type: string
              description: Selected entity's property address
              example: 2001 Red Gates
            address_2:
              type: string
              description: Selected entity's property additional address info
              example: Apt. 4B
            city:
              type: string
              description: Selected entity's property city
              example: New Orleans
            region:
              type: string
              description: Selected entity's property region
              example: Orleans
            zip_code:
              type: string
              description: Selected entity's property zip_code
              example: '70130'
        team:
          type: object
          required:
          - id
          - name
          - internal_label
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            name:
              type: string
              description: The name field is the Team name that is displayed on recipient facing reports and communication.
              example: The best company
            internal_label:
              type: string
              description: The internal label is a convenience label to help differentiate similar teams a user may belong to. It's displayed to you and your team members.
              example: The best company label
    api_user_external_identities:
      type: object
      description: Third-party identity verification payloads. Keys are provider-specific.
      properties:
        unlayer:
          type: object
          description: Unlayer email-builder identity verification (HMAC signed user id).
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            signature:
              type: string
              description: HMAC-SHA256 signature of the user id.
    me_get_user_requests_response_model:
      type: array
      description: Inspection requests pending action from the caller.
      items:
        $ref: '#/components/schemas/api_inspection_request'
    intercom_messenger_jwt_response_model:
      x-internal: true
      type: object
      required:
      - token
      description: Short-lived signed JWT used by the Intercom Messenger client to authenticate the caller.
      properties:
        token:
          type: string
          description: Signed Intercom Messenger JWT (HS256). Refresh on every Messenger boot — the token TTL is 10 minutes.
    api_user_metadata:
      type: object
      description: Per-user metadata document tracking onboarding dismissals, view-mode preferences and other UI state.
      required:
      - needs_to_perform_onboard_survey
      - needs_to_complete_subscription
      properties:
        import_residents_integration_appfolio_dismissed:
          type: boolean
          description: Whether the AppFolio import-residents integration banner has been dismissed.
        import_residents_integration_rentmanager_dismissed:
          type: boolean
          description: Whether the Rent Manager import-residents integration banner has been dismissed.
        import_units_integration_appfolio_dismissed:
          type: boolean
          description: Whether the AppFolio import-units integration banner has been dismissed.
        import_units_integration_rentmanager_dismissed:
          type: boolean
          description: Whether the Rent Manager import-units integration banner has been dismissed.
        inspection_onboarding_shown_count:
          type: integer
          description: Number of times the inspection-details onboarding has been shown to the user.
        onboarding_shown_count:
          type: integer
          description: Number of times the general onboarding has been shown.
        rating_shown_count:
          type: integer
          description: Number of times the in-app rating prompt has been shown.
        try_pro_plan_inspection_templates_card_shown_count:
          type: integer
          description: Number of times the "Try Pro plan templates" upsell card has been shown. Card is hidden once count reaches 30.
        feature_editing_dismissed:
          type: boolean
          description: Whether the feature-editing "don't show again" modal has been dismissed.
        inspection_view_mode:
          type: string
          enum:
          - list
          - review
          description: Preferred view mode on the inspection-details screen.
        sign_up_reason:
          type: string
          enum:
          - pm-signup
          - self-serve
          description: The reason the user signed up; used to tailor the onboarding flow.
        needs_to_perform_onboard_survey:
          type: boolean
          description: When true, the user must complete the onboarding survey before proceeding.
        needs_to_complete_subscription:
          type: boolean
          description: When true, the user must complete the subscription setup before proceeding.
        total_properties:
          type: integer
          description: Self-reported portfolio size captured at sign-up.
    user_create_response_model:
      type: object
      properties:
        user:
          description: The newly created user. Returned when account creation succeeds. The full profile document, not just the basic identity fields.
          $ref: '#/components/schemas/api_user'
        email_suggestion:
          type: object
          description: Returned when the supplied email looks like a typo and is not actually created.
          properties:
            message:
              type: string
            suggestion:
              type: string
    user_get_by_id_response_model:
      x-internal: true
      type: object
      properties:
        id:
          type: string
          description: Entity ID
          example: 00BRcZPSakXz6w7RYoE
        name:
          type: string
          description: The users full name
        type:
          type: string
          description: User Type designates whether the user is a Renter, Property Manager, or Landlord
          enum:
          - Renter
          - Property Manager
          - Landlord
        email:
          type: string
          description: The user's email. This is used for all email channel notifications for the user.
        created_date:
          type: string
          description: Entity creation date, in ISO format
          example: 2022-12-02 14:15:37.925000
    me_get_integration_token_response_model:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: Long-lived integration token the caller can use for service-to-service API calls.
    notification_preference:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Whether notifications for this category are enabled at all.
        email:
          type: string
          enum:
          - all
          - created_by_me
          description: Optional email-scoping rule when enabled. Defaults to all matching events when omitted.
    intercom_update_companies_response_model:
      x-internal: true
      type: object
      description: Result of attaching the caller to the requested Intercom company and refreshing their custom attributes. Both fields proxy the Intercom REST API response and are intentionally untyped.
      properties:
        company:
          description: Intercom company-attach response (the contact-to-company link). `null` / absent when the caller has an internal email or no email recorded — in that case the attach short-circuits without calling Intercom.
          nullable: true
        user:
          description: Intercom user-update response after refreshing the caller's custom attributes (rentcheck/chargebee subscription ids, company id).
    me_get_metabase_embed_token_response_model:
      x-internal: true
      type: object
      description: Envelope for `GET /v1/me/metabase-embed-token`. Returns `{ token }` wrapped in the standard `{ data }` shape.
      required:
      - status
      - data
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 200
        data:
          type: object
          required:
          - token
          properties:
            token:
              type: string
              description: Signed Metabase static-embedding JWT, scoped to the caller's subscription and locked to the Resident Insights dashboard. Signed with `HS256`, with a server-controlled TTL.
    user_update_access_request_model:
      type: object
      required:
      - team_ids
      - role
      - permission_group_ids
      properties:
        team_ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Teams the target user should belong to after the update. The user's team memberships are reconciled to this list.
        role:
          type: string
          enum:
          - admin
          - manager
          - none
          description: Role granted to the user inside a team membership.
        permission_group_ids:
          type: array
          items:
            type: string
          description: Permission groups the target user should belong to after the update. The user's permission group memberships are reconciled to this list.
    me_update_request_model:
      type: object
      description: Partial update for the authenticated user. Email or password changes require `current_password`.
      properties:
        name:
          type: string
          minLength: 1
          description: New display name.
        email:
          type: string
          format: email
          description: New email address. Requires `current_password` for re-authentication.
        password:
          type: string
          minLength: 8
          description: New password. Requires `current_password` for re-authentication.
        current_password:
          type: string
          description: Current password, required when changing `email` or `password`.
        feature_editing_dismissed:
          type: boolean
          description: Dismiss the feature-editing onboarding modal.
        rating_shown_count:
          type: integer
          description: Update the in-app rating prompt counter.
        inspection_onboarding_shown_count:
          type: integer
          description: Update the inspection onboarding shown counter.
        payment_info_provided:
          type: boolean
          description: Marks that the user has completed payment-method entry. Persisted on the user profile.
        try_pro_plan_inspection_templates_card_shown_count:
          type: integer
          description: Update the "Try Pro plan templates" upsell card shown counter.
    api_user_digest:
      type: object
      required:
      - id
      - name
      - email
      - type
      - teams
      - permission_groups
      - status
      properties:
        id:
          type: string
          description: Entity ID
          example: 00BRcZPSakXz6w7RYoE
        name:
          type: string
          description: The users full name
        email:
          type: string
          description: The user's email.
        type:
          type: string
          description: User type.
          enum:
          - Renter
          - Property Manager
          - Landlord
          - System
        status:
