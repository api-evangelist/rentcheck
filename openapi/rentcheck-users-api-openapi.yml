            users:
              type: array
              items:
                type: object
                required:
                - id
                - name
                - email
                - type
                - teams
                - permission_groups
                - status
                properties:
                  id:
                    type: string
                    description: Entity ID
                    example: 00BRcZPSakXz6w7RYoE
                  name:
                    type: string
                    description: The users full name
                  email:
                    type: string
                    description: The user's email.
                  type:
                    type: string
                    description: User type.
                    enum:
                    - Renter
                    - Property Manager
                    - Landlord
                    - System
                  status:
                    type: string
                    description: Status of the user. Status can be "Active" or the date on which the user was invited.
                    enum:
                    - Active
                    - Invite sent ({invite date})
                  teams:
                    type: array
                    description: A list of the teams the user belongs to, including the user's role on each.
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - internal_label
                      - role
                      properties:
                        id:
                          type: string
                          description: Entity ID
                          example: 00BRcZPSakXz6w7RYoE
                        name:
                          type: string
                          description: Team display name.
                        internal_label:
                          type: string
                          description: Internal label used to differentiate similar teams.
                        role:
                          type: string
                          enum:
                          - admin
                          - manager
                          - none
                          description: The user's membership role within this team.
                  permission_groups:
                    type: array
                    description: A list of the permission groups the user belongs to
                    items:
                      type: object
                      required:
                      - id
                      - name
                      properties:
                        id:
                          type: string
                          description: Entity ID
                          example: 00BRcZPSakXz6w7RYoE
                        name:
                          type: string
