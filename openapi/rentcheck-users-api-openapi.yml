          description: Users to apply the new permission groups to. Each user will be reconciled to membership in exactly the supplied permission groups.
        permission_group_ids:
          type: array
          items:
            type: string
          description: Permission groups to assign. Pass an empty array to remove the users from every permission group.
    user_invite_response_model:
      type: object
