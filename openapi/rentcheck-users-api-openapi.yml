  /v1/users/{userId}:
    delete:
      x-internal: true
      summary: Deactivate a user
      tags:
      - Users
      description: 'Deactivates the target user — removing them from every team and permission group on the caller''s

        subscription, deleting their pending team invites, and unassigning them from automations. The

        caller must (a) share an active subscription with the target user and (b) be an admin of at

        least one team on that subscription.

        '
      parameters:
      - name: userId
        in: path
        description: ID of the user to deactivate.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: User successfully deactivated.
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Forbidden — `user needs to be an admin` (the caller is not an admin on any team in the shared subscription).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 403
                  error:
                    type: string
                    example: user needs to be an admin
        '404':
          description: 'Not Found — `user not found` (the caller or target profile does not exist) or `subscription not found`

            (the caller and target do not share a single active subscription).

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 404
                  error:
                    type: string
                    example: user not found
  /v1/users/{id}:
    get:
