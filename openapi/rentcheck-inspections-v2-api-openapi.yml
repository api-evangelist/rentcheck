          - can_make_unit_edits
          - can_re_open
          - can_remove_non_review_revision_media
          description: Per-user permissions on the inspection. `can_manual_sync` is only present on the getById endpoint.
          properties:
            can_archive:
              type: boolean
            can_unarchive:
              type: boolean
            can_delete:
              type: boolean
            can_edit_due_date:
              type: boolean
            can_send_reminder:
              type: boolean
            can_edit_label:
              type: boolean
            can_copy_inspection_deeplink:
              type: boolean
            can_make_unit_edits:
              type: boolean
            can_re_open:
              type: boolean
            can_remove_non_review_revision_media:
              type: boolean
            can_manual_sync:
              type: boolean
        signature_acknowledgement:
          $ref: '#/components/schemas/api_signature_acknowledgement'
        sync_data:
          $ref: '#/components/schemas/api_integration_sync'
        sections_progress:
          type: array
          description: Per-section progress breakdown (only returned on the getById endpoint). Each entry pairs the originating section info with progress data.
          items:
            type: object
            required:
            - section
            - progress
            - is_na
            properties:
              section:
                type: object
                required:
                - name
                - name_with_ordinal
                - type
                description: Section descriptor.
                properties:
                  name:
                    type: string
                    description: Section name (e.g. "Bedroom", "Kitchen").
                  name_with_ordinal:
                    type: string
                    description: Section name including its ordinal index when the section is repeated on the property (e.g. "First Bedroom").
                  type:
                    type: string
                    enum:
                    - room
                    - section
                    description: Whether the section is a room (auto-generated from the property layout) or a free-form section.
              progress:
                type: number
                description: Progress through the section, as a 0-1 fraction.
              is_na:
                type: boolean
                description: Whether the performer marked the section not applicable.
    api_signature_acknowledgement:
      x-internal: true
      type: object
      required:
      - text
      - updated_by
      description: Signature acknowledgement.
      properties:
        text:
          type: string
        updated_by:
          type: object
          required:
          - id
          - username
          - email
          - updated_date
          properties:
            id:
              type: string
            username:
              type: string
            email:
              type: string
            updated_date:
              type: string
              format: date-time
    api_integration_sync:
      x-internal: true
      type: object
      nullable: true
      description: Canonical API shape for an inspection's integration sync state. Every vendor is mapped into this envelope — engine-native AppFolio / Buildium pass through, and legacy Rent Manager / Rentvine per-vendor sync objects are mapped up — so the client reads one uniform structure regardless of source vendor. Returns `null` on the inspection response when the inspection has no active integration sync.
      required:
      - vendor
      - vendor_integration_id
      - last_sync
      - status
      properties:
        vendor:
          type: string
          enum:
          - appfolio
          - rentvine
          - rentmanager
          - buildium
        vendor_integration_id:
          type: string
        last_sync:
          type: string
          nullable: true
          description: ISO string of the most recent successful sync; `null` when the record has never synced successfully.
        status:
          type: string
          description: '`scheduled` / `processing` mark in-flight manual re-syncs.'
          enum:
          - scheduled
          - processing
          - success
          - error
        error:
          type: object
          nullable: true
          required:
          - message
          description: 'Failure detail. Populated for `status: ''error''` even when the engine envelope only carried the failure per-resource on `upload_response` — the builder aggregates the per-resource messages up so the client always has a message to show.'
          properties:
            message:
              type: string
            vendor_request_id:
              type: string
        upload_response:
          type: object
          description: Per-destination upload outcome, keyed by resource. Any of the keys may be absent when the corresponding resource has not been attempted.
          properties:
            units:
              $ref: '#/components/schemas/api_inspection_upload_response_entry'
            properties:
              $ref: '#/components/schemas/api_inspection_upload_response_entry'
            occupancies:
              $ref: '#/components/schemas/api_inspection_upload_response_entry'
            work_orders:
              $ref: '#/components/schemas/api_inspection_upload_response_entry'
            inspections:
              $ref: '#/components/schemas/api_inspection_upload_response_entry'
        pending_since:
          type: string
          nullable: true
          description: ISO string set while `status` is `scheduled` / `processing`; used by the API to expire stale pending state past a TTL.
    inspection_v2_response_model:
      type: object
      required:
      - success
      - errors
      - warnings
      properties:
        success:
          type: array
          description: List of the created inspections
          items:
            type: object
            required:
            - property
            - inspection
            properties:
              property:
                type: object
                required:
                - id
                - address
                - city
                - zipcode
                properties:
                  id:
                    type: string
                    description: Entity ID
                    example: 00BRcZPSakXz6w7RYoE
                  x_id:
                    type: string
                    description: External property ID that maps to RentCheck properties
                  address:
                    type: string
                    description: This is the street address for the Unit.
                    example: 2001 Red Gates
                  city:
                    type: string
                    description: This is the city of the Unit.
                    example: New Orleans
                  zipcode:
                    type: string
                    description: This is the Postal Code for the Unit.
                    example: '70130'
              inspection:
                type: object
                required:
                - id
                - type
                - due_date
                properties:
                  id:
                    type: string
                    description: Entity ID
                    example: 00BRcZPSakXz6w7RYoE
                  x_id:
                    type: string
                    description: External inspection ID that maps to RentCheck inspections
                  type:
                    type: string
                    description: Inspection Type designates which type of inspection will be issued. Some inspection types require the user to select which features apply to the inspection. These features are designated in the 'selected_features' field.
                    enum:
                    - Move-in
                    - Move-out
                    - Annual
                    - Turn
                    - Periodic
                    - Maintenance Check
                    - Exterior
                    - Pre-Acquisition
                    - RV Lot
                    - Maintenance / Safety Check
                    - Community Maintenance Check
                  due_date:
                    type: string
                    description: The inspection due date (legacy) is the original date by which the recipient must complete the inspection.
                    example: 2021-12-02 14:15:37.925000
        errors:
          type: array
          description: List of the failed inspection creations
          items:
            type: object
            required:
            - inspection
            - reason
            properties:
              property:
                type: object
                properties:
                  id:
                    type: string
                    description: Entity ID
                    example: 00BRcZPSakXz6w7RYoE
                  x_id:
                    type: string
                    description: External property ID that maps to RentCheck properties
                  address:
                    type: string
                    description: This is the street address for the Unit.
                    example: 2001 Red Gates
                  city:
                    type: string
                    description: This is the city of the Unit.
                    example: New Orleans
                  zipcode:
                    type: string
                    description: This is the Postal Code for the Unit.
                    example: '70130'
              inspection:
                type: object
                properties:
                  x_id:
                    type: string
                    description: External inspection ID that maps to RentCheck inspections
                  type:
                    type: string
                    description: Inspection Type designates which type of inspection will be issued. Some inspection types require the user to select which features apply to the inspection. These features are designated in the 'selected_features' field.
                    enum:
                    - Move-in
                    - Move-out
                    - Annual
                    - Turn
                    - Periodic
                    - Maintenance Check
                    - Exterior
                    - Pre-Acquisition
                    - RV Lot
                    - Maintenance / Safety Check
                    - Community Maintenance Check
                  template:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Inspection template identifier
                      name:
                        type: string
                        description: Inspection template name.
                      internal_label:
                        type: string
                        description: Inspection template internal label.
              reason:
                type: string
                description: Detail of the creation error for the inspection
                example: invalid property
              status:
                type: string
                description: Optional machine-readable status code categorizing the error.
        warnings:
          type: array
          description: Inspections that succeeded but produced a non-fatal warning the caller should surface (for example, a soft validation hit that did not block creation).
          items:
            type: object
            required:
            - property
            - inspection
            - reason
            properties:
              property:
                type: object
                required:
                - id
                - address
                - city
                - zipcode
                properties:
                  id:
                    type: string
                    description: Entity ID
                    example: 00BRcZPSakXz6w7RYoE
                  x_id:
                    type: string
                    description: External property ID that maps to RentCheck properties
                  address:
                    type: string
                    description: This is the street address for the Unit.
                    example: 2001 Red Gates
                  city:
                    type: string
                    description: This is the city of the Unit.
                    example: New Orleans
                  zipcode:
                    type: string
                    description: This is the Postal Code for the Unit.
                    example: '70130'
              inspection:
                type: object
                required:
                - id
                - type
                - due_date
                properties:
                  id:
                    type: string
                    description: Entity ID
                    example: 00BRcZPSakXz6w7RYoE
                  x_id:
                    type: string
                    description: External inspection ID that maps to RentCheck inspections
                  type:
                    type: string
                    description: Inspection Type designates which type of inspection will be issued. Some inspection types require the user to select which features apply to the inspection. These features are designated in the 'selected_features' field.
                    enum:
                    - Move-in
                    - Move-out
                    - Annual
                    - Turn
                    - Periodic
                    - Maintenance Check
                    - Exterior
                    - Pre-Acquisition
                    - RV Lot
                    - Maintenance / Safety Check
                    - Community Maintenance Check
                  due_date:
                    type: string
                    description: The inspection due date (legacy) is the original date by which the recipient must complete the inspection.
                    example: 2021-12-02 14:15:37.925000
              reason:
                type: string
                description: Detail of the warning produced for the inspection
              status:
                type: string
                description: Optional machine-readable status code categorizing the warning.
        conflict:
          type: object
          description: Present when `check_automation_conflict_validation` was set and the request matched an existing automation. When present, no inspections are created — the caller is expected to resolve the conflict before retrying.
          properties:
            type:
              type: string
              enum:
              - automation
              description: Discriminator for the conflicting resource.
            info:
              type: object
              description: Conflicting automation.
              additionalProperties: true
