          type: string
          format: date-time
          description: Invite date used to schedule the recipient notification.
        created_date:
          type: string
          format: date-time
          description: ISO timestamp of when the inspection was created.
        created_by:
          type: object
          required:
          - id
          - name
          - email
          - type
          description: User that created the inspection.
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            name:
              type: string
              description: Name of the user
            email:
              type: string
              description: Email of the user
            type:
              type: string
              enum:
              - Renter
              - Property Manager
              - Landlord
              - System
              description: User type discriminator.
        invites:
          type: array
          description: Pending invite records that were materialized for the inspection (id, email and reference_code per invitee).
          items:
            type: object
            required:
            - id
            - email
            - reference_code
            properties:
              id:
                type: string
                description: Entity ID
                example: 00BRcZPSakXz6w7RYoE
              email:
                type: string
                format: email
                description: Invited email.
              reference_code:
                type: string
                description: Reference code that can be used by the invitee to claim the inspection (e.g. via the resident invite-accept flow).
        selected_features:
          type: array
          description: This field is an array of the areas and features selected for the inspection. Each Area contains a name and a list of the names of the applicable Features. This field is required depending on the inspection type.
          items:
            type: object
            properties:
              area:
                type: string
                description: Inspection's selected property area name to check
                example: Laundry Room
              features:
                type: array
                description: A specific feature inside the selected area
                items:
                  type: string
                example:
                - Laundry Room Walls
                - Laundry Room Floor, Ceiling, Walls
            example:
            - area: Laundry Room
              features:
              - Laundry Room Walls
              - Laundry Room Floor, Ceiling, Walls
            - area: Kitchen
              features:
              - Dishwasher Exterior
              - Freezer Interior
        team_id:
          type: string
          description: ID of the team the inspection belongs to.
          example: 00BRcZPSakXz6w7RYoE
        is_initial_review_complete:
          type: boolean
          description: Whether the initial review step has been marked complete.
        signer:
          type: object
          required:
          - id
          - name
          - email
          - type
          description: User recorded as the signer on the inspection signature, if any.
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            name:
              type: string
              description: Name of the user
            email:
              type: string
              description: Email of the user
            type:
              type: string
              enum:
              - Renter
              - Property Manager
              - Landlord
              - System
              description: User type discriminator.
        completed_by:
          type: object
          required:
          - id
          - name
          - email
          - type
          description: User that submitted / completed the inspection.
          properties:
            id:
              type: string
              description: Entity ID
              example: 00BRcZPSakXz6w7RYoE
            name:
              type: string
              description: Name of the user
            email:
              type: string
              description: Email of the user
            type:
              type: string
              enum:
              - Renter
              - Property Manager
              - Landlord
              - System
              description: User type discriminator.
        current_performer:
          type: object
          required:
          - id
          - name
          - email
          - type
