          required:
          - is_maintenance_flag_default_photos_enabled
          - is_resident_reported_maintenance_enabled
          - is_two_step_approval_required
          - can_record_video
          - can_take_360_photos
          - custom_maintenance_fields
          properties:
            is_maintenance_flag_default_photos_enabled:
              type: boolean
            is_resident_reported_maintenance_enabled:
              type: boolean
            is_two_step_approval_required:
              type: boolean
            can_record_video:
              type: boolean
            can_take_360_photos:
              type: boolean
            custom_maintenance_fields:
              type: array
              description: Custom maintenance fields enabled for this inspection.
              items:
                type: object
                required:
                - id
                - title
                - selection_type
                - options
                - enabled
                properties:
                  id:
                    type: string
                    description: Unique field id chosen by the user.
                  title:
                    type: string
                    description: Field title displayed in the flag modal, maintenance reports and CSV exports.
                  description:
                    type: string
                    description: Optional field description shown as a caption below the title.
                  selection_type:
