              type: number
            good_quantity:
              type: number
            fair_quantity:
              type: number
            poor_quantity:
              type: number
        review:
          type: object
          description: When a review has been requested, captures the original recipients and the review-step due date.
          required:
          - original_assigned_recipients
          - due_date
          properties:
            original_assigned_recipients:
              type: object
              required:
              - type
              description: Recipients assigned to perform / receive this inspection.
              properties:
                type:
                  type: string
                  description: The type that defines who has access to the inspection
                  enum:
                  - residents
                  - self-perform
                  - emails
                  - teammates
                  - myself
                  example: emails
                emails:
                  type: array
                  description: Specific emails assigned to this inspection when type is emails
                  items:
                    type: string
                resident_type:
                  type: string
                  description: Type of residents assigned to this inspection when type is residents
                  enum:
                  - current
                  - future
                  example: current
            due_date:
              type: string
              description: The inspection due date (legacy) is the original date by which the recipient must complete the inspection.
              example: 2021-12-02 14:15:37.925000
        completed_date:
          type: string
          description: Completed Date is the date that the user submitted the inspection for approval or completed the inspection if it was self-performed.
          example: 2021-12-02 14:15:37.925000
        signature:
          type: object
          required:
          - signed_by
          description: Inspection signature details.
          properties:
            signed_by:
              type: object
              required:
              - name
              - resident_id
              properties:
                name:
                  type: string
                  description: Name of the user that signed the inspection.
                resident_id:
                  type: string
                  description: ID of the resident that signed the inspection.
            signature_url:
              type: string
              description: Link to the signature image.
            signed_at:
              type: string
              description: Signature date, ISO format
              example: 2022-01-15 00:00:00
        approval:
          type: object
          nullable: true
          required:
          - approved_by_name
          - note
          - notification_sent_to
          - signature_text
          - approved_date
          description: Inspection approval details. Emitted as `null` when the inspection has not been approved rather than being omitted.
          properties:
            approved_by_name:
              type: string
              description: User name which approved the inspection
              example: Lucy Warburton
            approved_date:
              type: string
              description: ISO Date when the inspection was approved
              example: 2022-01-15 00:00:00
            note:
              type: string
              description: Note to add as feedback for RentCheck
              example: RentCheck inspection was easy and quick!
            notification_sent_to:
              type: string
              description: E-Mail sent to on inspection's approval
              example: lucywarburton@gmail.co
            rating:
              type: number
              description: Overall Inspection report rating (1-5)
              example: 5
            signature_text:
              type: string
              description: Inspection's approval signature text
              example: Lucy Warburton
        rejection:
          type: object
          nullable: true
          required:
          - rejected_by_name
          - rejected_date
          - note
          - notification_sent_to
          - due_date
          description: Inspection rejection details. Emitted as `null` when the inspection has not been rejected rather than being omitted.
          properties:
            rejected_by_name:
              type: string
              description: User name that rejected the inspection
              example: Lucy Warburton
            rejected_date:
              type: string
              description: ISO Date when the inspection was rejected
              example: 2022-01-15 00:00:00
            note:
              type: string
              description: Note about the inspection's rejection
              example: Test
            notification_sent_to:
              type: string
              description: E-Mail sent to on inspection's rejection
              example: lucywarburton@gmail.co
            due_date:
              type: string
              description: ISO Date of the inspections due date
              example: 2022-01-15 00:00:00
        health_score:
          type: object
          required:
          - score
          - details
          description: Score card for the current inspection.
          properties:
            score:
              type: number
              description: Overall health score
            details:
              type: object
              required:
              - completeness
              - condition_rating
              - extensive_notes
              - maintenance_flag
              - question_rating
              description: Breakdown of the different scoring groups.
              properties:
                completeness:
                  type: object
