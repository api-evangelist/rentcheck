                  properties:
                    enough_data:
                      type: number
                condition_rating:
                  type: object
                  required:
                  - fair_rating
                  - poor_rating
                  description: Score group covering the property-condition ratings.
                  properties:
                    fair_rating:
                      type: number
                    poor_rating:
                      type: number
                extensive_notes:
                  type: object
                  required:
                  - rating
                  description: Score group covering the presence of extensive performer notes.
                  properties:
                    rating:
                      type: number
                maintenance_flag:
                  type: object
                  required:
                  - rating
                  description: Score group covering maintenance flag coverage.
                  properties:
                    rating:
                      type: number
                question_rating:
                  type: object
                  required:
                  - rating
                  description: Score group covering question/answer ratings.
                  properties:
                    rating:
                      type: number
            areas_of_concern:
              type: array
              description: Score groups currently flagged as areas of concern, when the overall score is low.
              items:
                type: string
                enum:
                - Completeness
                - Property Condition
        progress_pct:
          type: number
          description: Percentage of how much the inspection is already completed
        pdf_report_location:
          type: string
          description: Link to the inspections completed PDF report if previously generated.
        settings:
          type: object
